name: Inventory QoL checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-qol-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Download pinned compiler and verify publisher checksum
        run: python tools/bootstrap_zig.py
      - name: Run reader, browser and native fixture checks
        run: python tools/test_inventory_qol.py
      - name: Check UI asset generation
        run: python tools/build_filter_assets.py

      # Full DLL compilation and native-font validation require the locally
      # installed supported game. No proprietary files are uploaded to CI.
